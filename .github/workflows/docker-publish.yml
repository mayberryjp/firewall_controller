name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firewall-controller-docker-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r registry/requirements.txt
      - run: python -m unittest discover -s registry -p "test_*.py"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: |
            mayberry4477/firewall-controller:latest
            mayberry4477/firewall-controller:${{ github.sha }}
      - name: Build and push device registry
        uses: docker/build-push-action@v7
        with:
          context: ./registry
          push: true
          no-cache: true
          tags: |
            mayberry4477/firewall-controller-registry:latest
            mayberry4477/firewall-controller-registry:${{ github.sha }}
