services:
  frontend:
    image: docker.io/mayberry4477/firewall-controller:latest
    container_name: modan-frontend
    ports:
      - "3030:80"
  registry:
    image: docker.io/mayberry4477/firewall-controller-registry:latest
    container_name: modan-registry
    ports:
      - "3031:8080"
    environment:
      REGISTRY_ADMIN_PASSWORD: ${REGISTRY_ADMIN_PASSWORD:?Set REGISTRY_ADMIN_PASSWORD}
      REGISTRY_ENCRYPTION_KEY: ${REGISTRY_ENCRYPTION_KEY:?Set REGISTRY_ENCRYPTION_KEY}
      REGISTRY_UI_ORIGINS: ${REGISTRY_UI_ORIGINS:-http://localhost:3030,http://127.0.0.1:3030}
    volumes:
      - /docker/modan/registry-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
